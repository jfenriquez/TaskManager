version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js 16 (App Router)
  - React 19
  - Tailwind CSS 4
  - daisyUI 5
  - better-auth
  - Prisma 6
  - PostgreSQL
  - GSAP 3
  - Framer Motion 12
  - lucide-react
  - date-fns
  - "@tanstack/react-table"
  - xlsx
routes:
  - path: /
    file: src/app/page.tsx
    auth_required: false
    description: Landing page (unauthenticated) or main task dashboard (authenticated)
  - path: /login
    file: src/app/login/page.tsx
    auth_required: false
    description: Login page with email/password and social OAuth buttons
  - path: /register
    file: src/app/register/page.tsx
    auth_required: false
    description: User registration page
  - path: /verify-email
    file: src/app/verify-email/page.tsx
    auth_required: false
    description: Email verification page with token from URL
  - path: /profile
    file: src/app/profile/page.tsx
    auth_required: true
    description: User profile with task statistics, streak, charts, heatmap
  - path: /categories
    file: src/app/categories/page.tsx
    auth_required: true
    description: Category CRUD management page
  - path: /TasksTable
    file: src/app/TasksTable/page.tsx
    auth_required: true
    description: Full task table with sorting, inline editing, Excel import/export
  - path: /admin
    file: src/app/admin/page.tsx
    auth_required: true
    description: Admin panel showing user info
  - path: /unauthorized
    file: src/app/unauthorized/page.tsx
    auth_required: false
    description: Placeholder unauthorized page
features:
  - name: User Registration
    description: Register with name, email, and password
    files:
      - src/app/register/page.tsx
      - src/lib/auth-client.ts
      - src/lib/auth.ts
    entry_route: /register
    user_interactions:
      - Fill name input field
      - Fill email input field
      - Fill password input field
      - Click Registrarse button to submit
      - See success message
      - Redirected to login page
    api_calls:
      - method: POST
        endpoint: /api/auth/sign-up/email
    auth_required: false
  - name: User Login
    description: Login with email and password or social OAuth
    files:
      - src/app/login/page.tsx
      - src/lib/auth-client.ts
      - src/hooks/useAuth.ts
    entry_route: /login
    user_interactions:
      - Fill email input field
      - Fill password input field
      - Click Iniciar Sesion button
      - See error message on invalid credentials
      - Click GitHub or Google button for OAuth
      - Click ¿Olvidaste tu contrasena? link
    api_calls:
      - method: POST
        endpoint: /api/auth/sign-in/email
      - method: POST
        endpoint: /api/auth/sign-in/social
    auth_required: false
  - name: Task CRUD
    description: Create, read, update, and delete tasks with categories, priorities, and timers
    files:
      - src/actions/taskActions.ts
      - src/hooks/useTasks.ts
      - src/components/tasks/TasksUI.tsx
      - src/components/tasks/TaskModal.tsx
      - src/components/tasks/TaskList.tsx
      - src/components/tasks/TaskItem.tsx
    entry_route: /
    user_interactions:
      - Click Nueva Tarea button
      - Fill task title, description, timer minutes, priority, category in modal
      - Click save button to create task
      - Click checkbox to toggle task completion
      - Click edit icon to modify task
      - Click delete icon to remove task
      - Click Eliminar completadas to remove all completed tasks
      - Filter tasks by Todas/Activas/Completadas tabs
    api_calls:
      - method: POST
        endpoint: /api/auth/session (via server action)
    auth_required: true
  - name: Task Timer
    description: Start, pause, and stop countdown timers on tasks
    files:
      - src/actions/taskActions.ts
      - src/hooks/useTimer.ts
      - src/components/tasks/TaskTimerControls.tsx
      - src/components/tasks/TaskItem.tsx
    entry_route: /
    user_interactions:
      - Click Empezar to start timer on a task
      - Click Pausar to pause running timer
      - Click Reiniciar to stop and reset timer
      - See remaining time countdown update every second
      - Hear sound and see notification when timer ends
    auth_required: true
  - name: Category Management
    description: Create, edit, and delete task categories with color picker
    files:
      - src/app/categories/page.tsx
      - src/actions/taskActions.ts
    entry_route: /categories
    user_interactions:
      - View all categories with colored dots
      - Type category name and pick color, click Agregar
      - Click pencil icon to edit category name/color
      - Click trash icon to delete category
      - Confirm deletion dialog
    auth_required: true
  - name: Excel Import/Export
    description: Import tasks from and export tasks to Excel spreadsheets
    files:
      - src/app/TasksTable/page.tsx
      - src/components/tasks/TasksTableWrapper.tsx
      - src/components/tasks/TasksTable.tsx
    entry_route: /TasksTable
    user_interactions:
      - Click Exportar a Excel to download spreadsheet
      - Click Importar Excel to upload file
      - Select .xlsx file from file picker
      - See imported tasks appear in table
      - Edit timer minutes or execution date inline
      - Toggle completion via checkbox
      - Sort columns by clicking headers
    auth_required: true
  - name: Profile & Statistics
    description: View user profile with task statistics, charts, and activity heatmap
    files:
      - src/app/profile/page.tsx
      - src/actions/taskActions.ts
    entry_route: /profile
    user_interactions:
      - View total/completed/active task counts
      - View streak counter and member since date
      - See category distribution donut chart
      - See top 5 time-consuming tasks
      - See priority bar chart
      - View 30-day activity heatmap
    auth_required: true
  - name: Theme Switcher
    description: Change app theme from 11 daisyUI themes
    files:
      - src/context/ThemeProvider.tsx
    entry_route: /
    user_interactions:
      - Click theme button (floating top-right)
      - Select theme from dropdown
      - See theme change applied immediately
    auth_required: false
  - name: Ambient Audio Player
    description: Play ambient music tracks from the sidebar
    files:
      - src/components/AudioPlayer.tsx
    entry_route: /
    user_interactions:
      - Click play/pause button
      - Click next/previous track buttons
      - Adjust volume slider
      - See track progress bar
    auth_required: true
  - name: Email Verification
    description: Verify user email via token link
    files:
      - src/app/verify-email/page.tsx
    entry_route: /verify-email
    user_interactions:
      - Click verification link in email
      - See verification status (success/error)
      - Auto-redirect to login after 3 seconds on success
    api_calls:
      - method: GET
        endpoint: /api/auth/verify-email
    auth_required: false
known_limitations:
  - issue: Email validation hook blocks all real registrations (requires @example.com)
    location: src/lib/auth.ts
    impact: No real users can register
  - issue: Forgot password link is broken (href="#")
    location: src/app/login/page.tsx
    impact: Users cannot reset password
  - issue: /unauthorized page shows placeholder text 'pageaaaaaa'
    location: src/app/unauthorized/page.tsx
    impact: Poor UX for unauthorized users
  - issue: deleteTasksCompleted deletes ALL users completed tasks (no userId filter)
    location: src/actions/taskActions.ts
    impact: Data leak across users
  - issue: No middleware for route protection
    location: src/app
    impact: Unauthenticated users can briefly access protected routes
  - issue: Timer sync is client-side only, no cross-tab synchronization
    location: src/hooks/useTimer.ts
    impact: Multiple tabs run independent timers
  - issue: Admin page is minimal, ADMIN role shows skeleton on main page
    location: src/app/admin/page.tsx
    impact: No useful admin dashboard
  - issue: NEXTAUTH_SECRET/NEXTAUTH_URL in .env.example are from old NextAuth.js setup
    location: .env.example
    impact: Confusing configuration
